name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Code Quality & Flake Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nixos-raspberrypi.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: FlakeHub Nix Cache
        uses: DeterminateSystems/flakehub-cache-action@v1

      - name: Run pre-commit checks (Alejandra, Gitleaks, Statix, Deadnix)
        run: nix build .#checks.x86_64-linux.pre-commit-check

      - name: Verify Flake Evaluation
        run: nix flake check --no-build
